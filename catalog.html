<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공식 굿즈 도감 — Frieren Archive</title>
<style>
:root{--ink:#30283b;--muted:#81768f;--purple:#75608f;--pale:#f4eff8;--paper:#faf8f2;--line:#e8e0eb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;background:var(--purple);color:#fff;font-weight:700}button.secondary{background:#eee8f4;color:var(--ink);border:1px solid var(--line)}a{color:var(--purple)}.wrap{max-width:1200px;margin:auto;padding:22px}.hero{background:linear-gradient(120deg,#292338,#4b3c62);color:white;border-radius:22px;padding:24px}.brand{font-size:12px;letter-spacing:3px;color:#d7c8e9;font-weight:800}.hero h1{font-family:Georgia,serif;font-size:clamp(27px,4vw,40px);margin:12px 0}.hero p{color:#e1d8e9;line-height:1.6;margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1;min-width:220px}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.photo{height:190px;background:linear-gradient(145deg,#f0eaf6,#faf6ef);display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.placeholder{color:#a394b8;text-align:center;padding:15px}.body{padding:13px;display:flex;flex-direction:column;gap:8px;flex:1}.meta{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}.body h3{font-size:14px;line-height:1.45;margin:0}.small{font-size:12px;color:var(--muted);line-height:1.5}.badge{display:inline-block;border-radius:99px;background:#f0eaf6;color:#6b5680;padding:4px 7px;font-size:10px;font-weight:800}.badge.warn{background:#fff0d6;color:#855d21}.foot{display:flex;gap:7px;margin-top:auto}.foot button{flex:1;font-size:12px;padding:9px 5px}.empty{background:#fff;border:1px dashed #d8cbe5;border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}.notice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.6;margin:12px 0}.status{font-size:12px;color:var(--muted);margin:10px 0}.footer{text-align:center;color:#9a90a2;font-size:11px;padding:28px 0}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{height:145px}.body{padding:10px}.toolbar input{min-width:100%}}
</style></head><body><div class="wrap">
<header class="hero"><div class="brand">✧ FRIEREN ARCHIVE · CATALOGUE</div><h1>공식 굿즈 도감</h1><p>공식 사이트에서 수집한 상품 후보를 살펴보고 내 컬렉션에 추가하세요.<br>소장 여부와 수량은 추가할 때 직접 선택합니다.</p></header>
<div class="toolbar"><input id="q" placeholder="상품명·제조사·시리즈 검색"><select id="cat"><option value="">모든 카테고리</option></select><select id="filter"><option value="all">전체 상품</option><option value="unknown">정보 확인 필요</option><option value="dated">발매일 확인됨</option></select><button class="secondary" onclick="location.href='index.html'">← 내 컬렉션</button></div>
<div class="notice">이 목록은 자동 수집된 상품 후보입니다. 자동 수집 과정에서 상품명·이미지·발매 정보가 누락되거나 잘못 분류될 수 있습니다. 상품 카드의 공식 출처를 확인해 주세요. 이미지 및 정보는 각 원본 사이트의 정책을 따릅니다. 캔뱃지 상품은 제외됩니다.</div>
<div class="status" id="status">상품 목록을 불러오는 중…</div><div class="grid" id="grid"></div><div class="footer">FRIEREN ARCHIVE · 자동 수집 목록은 정기 갱신됩니다.</div>
</div>
<script>
const KEY="frierenArchiveItems_v1";
const CATS=["피규어","가챠·캡슐토이","아크릴·키링","봉제·인형","카드·브로마이드","생활 잡화","의류·패션","특전·한정 굿즈","기타"];
const $=id=>document.getElementById(id);let catalog=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("cat").innerHTML='<option value="">모든 카테고리</option>'+CATS.map(c=>`<option>${esc(c)}</option>`).join("");
function loadItems(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return []}}
function classify(p){let t=(p.title||"").toLowerCase();if(/figure|フィギュア|피규어/.test(t))return "피규어";if(/ぬいぐるみ|マスコット|plush|doll|인형/.test(t))return "봉제·인형";if(/アクリル|キーホルダー|acrylic|keychain|키링/.test(t))return "아크릴·키링";if(/カード|ブロマイド|クリアカード|card|photo card|포토카드/.test(t))return "카드·브로마이드";if(/カプセル|ガシャポン|ガチャ|capsule|가챠/.test(t))return "가챠·캡슐토이";if(/tシャツ|パーカー|ジャケット|アパレル|shirt|hoodie|clothing|의류/.test(t))return "의류·패션";if(/特典|限定|bonus|limited|特装/.test(t))return "특전·한정 굿즈";if(/缶バッジ|カンバッジ|缶バッチ|can badge|캔뱃지|캔 배지/.test(t))return null;return "기타"}
function render(){const q=$("q").value.toLowerCase().trim(),cat=$("cat").value,f=$("filter").value;const list=catalog.filter(p=>{const t=[p.title,p.maker,p.series,p.category].join(" ").toLowerCase();if(q&&!t.includes(q))return false;if(cat&&p.category!==cat)return false;if(f==="unknown"&&p.release_date)return false;if(f==="dated"&&!p.release_date)return false;return true});$("status").textContent=`${list.length.toLocaleString("ko-KR")}개 상품 후보 · 마지막 갱신 ${catalog.updated_at?new Date(catalog.updated_at).toLocaleString("ko-KR"):"정보 없음"}`;$("grid").innerHTML=list.length?list.map(p=>{const img=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'<div class="placeholder">✧<br>이미지 확인 필요</div>';const missing=[];if(!p.release_date)missing.push("발매일 미확인");if(!p.price)missing.push("가격 미확인");if(!p.image_url)missing.push("이미지 미확인");if(!p.maker)missing.push("제조사 미확인");if(!p.series)missing.push("시리즈 미확인");return `<article class="card"><div class="photo">${img}</div><div class="body"><div class="meta"><span>${esc(p.category||"기타")}</span>${p.maker?`<span>· ${esc(p.maker)}</span>`:""}</div><h3>${esc(p.title)}</h3><div class="small">${p.release_date?"발매일: "+esc(p.release_date):'<span class="badge warn">발매일 미확인</span>'} ${p.price?" · "+esc(p.price):""}</div><div class="small">${missing.length?'<span class="badge warn">정보 확인 필요</span> '+esc(missing.join(" · ")):'<span class="badge">기본 정보 수집됨</span>'}</div><div class="small">${p.series?"시리즈: "+esc(p.series)+"<br>":""}<a href="${esc(p.source_url)}" target="_blank" rel="noopener">공식 출처 열기 ↗</a></div><div class="foot"><button onclick="addItem('${esc(p.catalog_id)}','wish')">위시리스트</button><button class="secondary" onclick="addItem('${esc(p.catalog_id)}','owned')">소장 추가</button></div></div></article>`}).join(""):'<div class="empty">조건에 맞는 상품이 없습니다.</div>'}
function addItem(id,status){const p=catalog.find(x=>x.catalog_id===id);if(!p)return;const items=loadItems();const existing=items.find(i=>i.catalog_id===id||i.source_url===p.source_url);if(existing){alert("이미 내 컬렉션에 등록된 상품입니다. 내 컬렉션에서 확인해 주세요.");return}const item={id:"official_"+id,catalog_id:id,source_url:p.source_url,name:p.title,category:p.category||"기타",character:"",series:p.series||"",status,qty:status==="owned"?1:0,price:0,date:"",image:p.image_url||"",photo:null,store:p.maker||"",source:p.verified?"official":"unverified",notes:`공식 출처에서 자동 수집한 후보입니다.${p.release_date?" 발매일: "+p.release_date:" 발매일 확인 필요."}${p.price?" 가격: "+p.price:" 가격 확인 필요."} 출처: ${p.source_url}`,release_date:p.release_date||null,price_text:p.price||null,created:Date.now()};items.unshift(item);localStorage.setItem(KEY,JSON.stringify(items));alert(status==="wish"?"위시리스트에 추가했습니다.":"컬렉션에 추가했습니다. 소장 수량과 구매 가격은 내 컬렉션에서 수정할 수 있어요.");}
$("q").addEventListener("input",render);$("cat").addEventListener("change",render);$("filter").addEventListener("change",render);
fetch("./catalog.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("catalog.json not found");return r.json()}).then(d=>{catalog=d.items||[];catalog.updated_at=d.updated_at;render()}).catch(()=>{$("status").textContent="공식 도감 데이터가 아직 없습니다. 프로젝트를 웹에 배포하고 GitHub Actions 자동 수집을 설정하면 목록이 생성됩니다."; $("grid").innerHTML='<div class="empty">아직 수집된 상품 목록이 없습니다.<br><small>README의 자동 수집 설정을 완료해 주세요.</small></div>'});
</script></body></html>
